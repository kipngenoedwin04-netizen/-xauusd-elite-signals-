<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Elite Signals - PWA Icons</title>
    <style>
        :root {
            --bg-dark: #0a0b0d;
            --card-bg: #14171d;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #f0f2f5;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--gold-primary);
            font-size: 2rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: #8a94a6;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .icon-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, border-color 0.2s;
        }

        .icon-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-primary);
        }

        .preview-box {
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
        }

        .details {
            text-align: center;
            margin-bottom: 20px;
        }

        .filename {
            font-family: monospace;
            font-weight: bold;
            color: var(--gold-light);
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .dimensions {
            font-size: 0.85rem;
            color: #8a94a6;
        }

        .btn-download {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        .btn-download:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>XAUUSD Elite Signals</h1>
    <p class="subtitle">Official PWA App Icons — Click download to save each PNG file for your repository.</p>

    <div class="container">
        <!-- 192x192 -->
        <div class="icon-card">
            <div class="preview-box">
                <canvas id="canvas192" width="192" height="192"></canvas>
            </div>
            <div class="details">
                <div class="filename">icon-192.png</div>
                <div class="dimensions">192 × 192 pixels</div>
            </div>
            <button class="btn-download" onclick="downloadIcon('canvas192', 'icon-192.png')">Download PNG</button>
        </div>

        <!-- 512x512 -->
        <div class="icon-card">
            <div class="preview-box">
                <canvas id="canvas512" width="512" height="512" style="width:192px; height:192px;"></canvas>
            </div>
            <div class="details">
                <div class="filename">icon-512.png</div>
                <div class="dimensions">512 × 512 pixels</div>
            </div>
            <button class="btn-download" onclick="downloadIcon('canvas512', 'icon-512.png')">Download PNG</button>
        </div>

        <!-- 180x180 -->
        <div class="icon-card">
            <div class="preview-box">
                <canvas id="canvas180" width="180" height="180"></canvas>
            </div>
            <div class="details">
                <div class="filename">apple-touch-icon.png</div>
                <div class="dimensions">180 × 180 pixels</div>
            </div>
            <button class="btn-download" onclick="downloadIcon('canvas180', 'apple-touch-icon.png')">Download PNG</button>
        </div>
    </div>

    <script>
        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const scale = size / 512; // Base design scale on 512x512

            // Background
            ctx.fillStyle = '#090a0f';
            ctx.fillRect(0, 0, size, size);

            // Subtle Gold Glow Background
            const bgGlow = ctx.createRadialGradient(size/2, size/2, 10 * scale, size/2, size/2, 220 * scale);
            bgGlow.addColorStop(0, 'rgba(212, 175, 55, 0.15)');
            bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = bgGlow;
            ctx.fillRect(0, 0, size, size);

            // Gold Gradient Setup
            const goldGrad = ctx.createLinearGradient(100 * scale, 80 * scale, 400 * scale, 400 * scale);
            goldGrad.addColorStop(0, '#FFE57F');
            goldGrad.addColorStop(0.3, '#D4AF37');
            goldGrad.addColorStop(0.7, '#AA7C11');
            goldGrad.addColorStop(1, '#FFDF00');

            // 1. Draw Bull Symbol (Left side)
            ctx.fillStyle = goldGrad;
            ctx.strokeStyle = goldGrad;
            ctx.lineWidth = 4 * scale;

            // Bull Horns & Head
            ctx.beginPath();
            ctx.moveTo(130 * scale, 180 * scale);
            ctx.bezierCurveTo(110 * scale, 140 * scale, 140 * scale, 120 * scale, 180 * scale, 150 * scale);
            ctx.bezierCurveTo(160 * scale, 180 * scale, 170 * scale, 200 * scale, 190 * scale, 210 * scale);
            ctx.bezierCurveTo(150 * scale, 220 * scale, 130 * scale, 210 * scale, 130 * scale, 180 * scale);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(175 * scale, 205 * scale);
            ctx.lineTo(210 * scale, 250 * scale);
            ctx.lineTo(190 * scale, 270 * scale);
            ctx.lineTo(165 * scale, 235 * scale);
            ctx.closePath();
            ctx.fill();

            // 2. Draw Candlesticks (Center-Right)
            // Left Candlestick (Bullish)
            ctx.fillRect(250 * scale, 180 * scale, 35 * scale, 110 * scale);
            ctx.fillRect(264 * scale, 140 * scale, 7 * scale, 170 * scale);

            // Right Candlestick (Bullish High)
            ctx.fillRect(320 * scale, 130 * scale, 35 * scale, 130 * scale);
            ctx.fillRect(334 * scale, 90 * scale, 7 * scale, 200 * scale);

            // Upward Trend Arrow
            ctx.beginPath();
            ctx.moveTo(375 * scale, 180 * scale);
            ctx.lineTo(415 * scale, 120 * scale);
            ctx.lineTo(380 * scale, 120 * scale);
            ctx.lineTo(415 * scale, 120 * scale);
            ctx.lineTo(415 * scale, 155 * scale);
            ctx.lineWidth = 10 * scale;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // 3. Typography
            ctx.textAlign = 'center';
            
            // "XAUUSD"
            ctx.font = `900 ${44 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.fillStyle = goldGrad;
            ctx.letterSpacing = `${2 * scale}px`;
            ctx.fillText('XAUUSD', 256 * scale, 375 * scale);

            // "ELITE"
            ctx.font = `600 ${28 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.fillStyle = '#E5C158';
            ctx.fillText('E L I T E', 256 * scale, 415 * scale);
        }

        // Generate all icons on page load
        window.onload = () => {
            drawIcon('canvas192', 192);
            drawIcon('canvas512', 512);
            drawIcon('canvas180', 180);
        };

        // Download helper function
        function downloadIcon(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
