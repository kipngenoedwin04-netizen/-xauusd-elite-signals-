name: Import XAUUSD project

on:
  push:
    paths:
      - 'xauusd-elite-signals-v1.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/project
          unzip -q xauusd-elite-signals-v1.zip -d /tmp/project
          cp -a /tmp/project/xauusd-elite-signals/. .
          rm xauusd-elite-signals-v1.zip

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add XAUUSD Elite Signals source code"
          git push
